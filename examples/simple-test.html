<!DOCTYPE html>
<html>
<head>
    <title>SyntJS - Proper Architecture Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #app {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 80px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .counter {
            font-size: 72px;
            font-weight: bold;
            text-align: center;
            margin: 30px 0;
            color: #667eea;
            transition: color 0.3s;
        }

        .counter.negative {
            color: #f56565;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        button {
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .decrement {
            background: #f56565;
            color: white;
        }

        .reset {
            background: #a0aec0;
            color: white;
        }

        .increment {
            background: #48bb78;
            color: white;
        }

        .stats {
            background: #f7fafc;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            border-left: 4px solid #4299e1;
        }

        .stats h3 {
            color: #2d3748;
            margin-bottom: 10px;
        }

        .stats p {
            color: #718096;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            background: #c6f6d5;
            color: #22543d;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }

        .features {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .feature-tag {
            background: #ebf8ff;
            color: #2b6cb0;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div id="app">
    <!-- App will be mounted here -->
    <p style="text-align: center; color: #718096;">
        Loading SyntJS application...
    </p>
</div>

<script type="module">
  import { createApp, useState } from '../dist/index.js'

  function Counter() {
    const [count, setCount] = useState(0);

    return (
      <div>
        <h1>Count: {count}</h1>
        <button onClick={() => setCount(c => c + 1)}>
          Increment
        </button>
      </div>
    );
  }

  createApp(Counter).mount('#app');
</script>
</body>
</html>
